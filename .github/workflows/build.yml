name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p "$(dirname settings.gradle)"
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "HizliAI"
          include ':app'
          EOF_0
          mkdir -p "$(dirname build.gradle)"
          cat > build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_1
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_2
          mkdir -p "$(dirname app/build.gradle)"
          cat > app/build.gradle <<'EOF_3'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tvai.hizli'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tvai.hizli'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_3
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.hardware.microphone" android:required="false"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
              </queries>
              <application
                  android:label="Hızlı Yapay Zeka"
                  android:icon="@drawable/ic"
                  android:banner="@drawable/ic"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p "$(dirname app/src/main/res/drawable/ic.xml)"
          cat > app/src/main/res/drawable/ic.xml <<'EOF_5'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp" android:height="180dp"
              android:viewportWidth="320" android:viewportHeight="180">
              <path android:fillColor="#111114" android:pathData="M0,0h320v180h-320z"/>
              <path android:fillColor="#3B82F6" android:pathData="M160,50 L172,84 L206,96 L172,108 L160,142 L148,108 L114,96 L148,84 z"/>
          </vector>
          EOF_5
          mkdir -p "$(dirname app/src/main/java/com/tvai/hizli/MainActivity.java)"
          cat > app/src/main/java/com/tvai/hizli/MainActivity.java <<'EOF_6'
          package com.tvai.hizli;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              static final String[] U = {"https://www.google.com/search?udm=50", "https://duck.ai/"};
              static final String[] N = {"Google AI Modu", "Duck.ai"};
              WebView web;
              LinearLayout home, app;
              SpeechRecognizer sr;
              AlertDialog listen;
              int cur = 0;

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              GradientDrawable bg(int c) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(c);
                  g.setCornerRadius(dp(16));
                  return g;
              }

              TextView btn(String t, int sp, final Runnable r) {
                  TextView b = new TextView(this);
                  b.setText(t);
                  b.setTextSize(sp);
                  b.setTextColor(Color.WHITE);
                  b.setGravity(Gravity.CENTER);
                  b.setFocusable(true);
                  b.setClickable(true);
                  final GradientDrawable n = bg(0xFF2A2A30), f = bg(0xFF3B82F6);
                  b.setBackground(n);
                  b.setOnFocusChangeListener((v, h) -> v.setBackground(h ? f : n));
                  b.setOnClickListener(v -> r.run());
                  return b;
              }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF111114);

                  home = new LinearLayout(this);
                  home.setOrientation(LinearLayout.VERTICAL);
                  home.setGravity(Gravity.CENTER);
                  TextView t = new TextView(this);
                  t.setText("Lütfen yapay zeka modelinizi seçin");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(26);
                  t.setGravity(Gravity.CENTER);
                  home.addView(t);
                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER);
                  for (int i = 0; i < 2; i++) {
                      final int k = i;
                      LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(dp(300), dp(160));
                      p.setMargins(dp(16), dp(40), dp(16), 0);
                      row.addView(btn(N[i], 24, () -> open(k)), p);
                  }
                  home.addView(row);
                  root.addView(home, new FrameLayout.LayoutParams(-1, -1));

                  app = new LinearLayout(this);
                  app.setVisibility(View.GONE);
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.VERTICAL);
                  bar.setGravity(Gravity.CENTER);
                  bar.setBackgroundColor(0xFF1C1C22);
                  String[] L = {"Ana", "▲", "Mik", "▼"};
                  Runnable[] A = {() -> showHome(), () -> scroll(-1), () -> mic(), () -> scroll(1)};
                  for (int i = 0; i < 4; i++) {
                      LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(dp(76), dp(66));
                      p.setMargins(0, dp(8), 0, dp(8));
                      bar.addView(btn(L[i], 18, A[i]), p);
                  }
                  app.addView(bar, new LinearLayout.LayoutParams(dp(96), -1));

                  web = new WebView(this);
                  WebSettings ws = web.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setUserAgentString(ws.getUserAgentString().replace("; wv", ""));
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);
                  web.setWebViewClient(new WebViewClient());
                  web.setBackgroundColor(Color.BLACK);
                  app.addView(web, new LinearLayout.LayoutParams(0, -1, 1));
                  root.addView(app, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
              }

              void open(int k) {
                  cur = k;
                  home.setVisibility(View.GONE);
                  app.setVisibility(View.VISIBLE);
                  web.loadUrl(U[k]);
                  web.requestFocus();
              }

              void showHome() {
                  app.setVisibility(View.GONE);
                  home.setVisibility(View.VISIBLE);
                  home.requestFocus();
              }

              @Override
              public void onBackPressed() {
                  if (app.getVisibility() == View.VISIBLE) {
                      if (web.canGoBack()) web.goBack(); else showHome();
                  } else super.onBackPressed();
              }

              void scroll(int d) {
                  float dens = getResources().getDisplayMetrics().density;
                  int px = (int) (web.getHeight() * 0.7f * d / dens);
                  web.evaluateJavascript("(function(d){var b=document.scrollingElement,m=0,e=null;"
                      + "document.querySelectorAll('*').forEach(function(x){"
                      + "if(x.scrollHeight>x.clientHeight+20&&x.clientHeight>m&&/(auto|scroll)/.test(getComputedStyle(x).overflowY)){m=x.clientHeight;e=x;}});"
                      + "(e&&m>=innerHeight*0.5?e:b).scrollBy({top:d,behavior:'smooth'});})(" + px + ")", null);
              }

              void mic() {
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                      return;
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      Toast.makeText(this, "Bu cihazda konuşma tanıma yok, yazarak sorun", Toast.LENGTH_LONG).show();
                      ask("");
                      return;
                  }
                  if (sr == null) {
                      sr = SpeechRecognizer.createSpeechRecognizer(this);
                      sr.setRecognitionListener(new RecognitionListener() {
                          public void onReadyForSpeech(android.os.Bundle p) {}
                          public void onBeginningOfSpeech() {}
                          public void onRmsChanged(float v) {}
                          public void onBufferReceived(byte[] b) {}
                          public void onEndOfSpeech() {}
                          public void onPartialResults(android.os.Bundle p) {}
                          public void onEvent(int t, android.os.Bundle p) {}
                          public void onError(int e) {
                              closeListen();
                              Toast.makeText(MainActivity.this, "Anlaşılamadı", Toast.LENGTH_SHORT).show();
                              ask("");
                          }
                          public void onResults(android.os.Bundle r) {
                              closeListen();
                              ArrayList<String> l = r.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              ask(l == null || l.isEmpty() ? "" : l.get(0));
                          }
                      });
                  }
                  listen = new AlertDialog.Builder(this).setTitle("Dinleniyor…").setMessage("Sorunuzu söyleyin")
                      .setNegativeButton("İptal", (d, w) -> sr.cancel()).create();
                  listen.show();
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR");
                  sr.startListening(i);
              }

              void closeListen() {
                  if (listen != null && listen.isShowing()) listen.dismiss();
              }

              @Override
              public void onRequestPermissionsResult(int c, String[] p, int[] g) {
                  if (g.length > 0 && g[0] == PackageManager.PERMISSION_GRANTED) mic();
              }

              void ask(String t) {
                  final EditText e = new EditText(this);
                  e.setText(t);
                  new AlertDialog.Builder(this).setTitle("Sorunuz").setView(e)
                      .setPositiveButton("Gönder", (d, w) -> send(e.getText().toString()))
                      .setNeutralButton("Tekrar konuş", (d, w) -> mic())
                      .setNegativeButton("İptal", null).show();
              }

              void send(String t) {
                  t = t.trim();
                  if (t.isEmpty()) return;
                  if (cur == 0) {
                      web.loadUrl(U[0] + "&q=" + Uri.encode(t));
                      return;
                  }
                  web.evaluateJavascript("(function(t){"
                      + "var e=document.querySelector('textarea')||document.querySelector('[contenteditable=\"true\"]')||document.querySelector('input[type=text],input[type=search]');"
                      + "if(!e)return;e.focus();"
                      + "if(e.isContentEditable){document.execCommand('selectAll');document.execCommand('insertText',false,t);}"
                      + "else{Object.getOwnPropertyDescriptor(Object.getPrototypeOf(e),'value').set.call(e,t);e.dispatchEvent(new Event('input',{bubbles:true}));}"
                      + "setTimeout(function(){var f=e.closest('form');"
                      + "var b=(f&&f.querySelector('button[type=submit]'))||document.querySelector('button[aria-label*=Send],button[aria-label*=Gönder],button[aria-label*=Submit]');"
                      + "if(b)b.click();else e.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true}));},400);"
                      + "})(" + JSONObject.quote(t) + ")", null);
              }
          }
          EOF_6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HizliAI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
